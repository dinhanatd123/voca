    <script>
      (function () {
        function loadStaticFallbackIfNeeded() {
          var isViteDev = !!document.querySelector('script[src*="@vite/client"]');
          var isViteBuilt = !!document.querySelector('script[src*="assets/index-"]');
          if (!isViteDev && !isViteBuilt) {
            var css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = './public/static-bundle.css';
            document.head.appendChild(css);

            var js = document.createElement('script');
            js.type = 'module';
            js.src = './public/static-bundle.js';
            document.body.appendChild(js);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadStaticFallbackIfNeeded);
        } else {
          loadStaticFallbackIfNeeded();
        }
      })();
