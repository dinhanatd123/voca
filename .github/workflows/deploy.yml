name: Deploy static content to Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static bundle for GitHub Pages
        run: |
          mkdir -p _site/public
          cp public/static-bundle.css _site/static-bundle.css
          cp public/static-bundle.js _site/static-bundle.js
          cp public/static-bundle.css _site/public/static-bundle.css
          cp public/static-bundle.js _site/public/static-bundle.js
          touch _site/.nojekyll
          cat << EOF > _site/index.html
          <!doctype html>
          <html lang="vi">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
              <meta http-equiv="Pragma" content="no-cache" />
              <meta http-equiv="Expires" content="0" />
              <title>LexiFlow — Học Từ Vựng 3 Tầng (Từ → Cụm → Câu) Chuẩn TOEIC, IELTS & Công Sở</title>
              <meta name="description" content="Ứng dụng học từ vựng tiếng Anh 3 tầng (Từ đơn → Cụm Collocation → Câu hoàn chỉnh) chuẩn TOEIC, IELTS, Giao tiếp Công sở & Đời thường kèm SRS và AI Chấm Câu." />
              <meta property="og:title" content="LexiFlow — Học Từ Vựng 3 Tầng (Từ → Cụm → Câu)" />
              <meta property="og:description" content="Ứng dụng học từ vựng tiếng Anh 3 tầng (Từ đơn → Cụm Collocation → Câu hoàn chỉnh) chuẩn TOEIC, IELTS, Giao tiếp Công sở & Đời thường kèm SRS và AI Chấm Câu." />
              <meta property="og:type" content="website" />
              <meta name="twitter:card" content="summary_large_image" />
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
              <link rel="stylesheet" href="./static-bundle.css?v=${GITHUB_RUN_ID}" />
              <script>
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistrations().then(function (registrations) {
                    for (var i = 0; i < registrations.length; i++) {
                      registrations[i].unregister();
                    }
                  }).catch(function () {});
                }
              </script>
            </head>
            <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600 selection:text-white">
              <div id="root"></div>
              <script type="module" src="./static-bundle.js?v=${GITHUB_RUN_ID}"></script>
            </body>
          </html>
          EOF
          cp _site/index.html _site/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
